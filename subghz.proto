syntax = "proto3";

package PB_SubGhz;
option java_package = "com.flipperdevices.protobuf.subghz";

enum RadioDevice {
    RADIO_DEVICE_INTERNAL = 0;
    RADIO_DEVICE_EXTERNAL = 1;
    /* Use the external module when one is plugged in, else the internal one.
     * RxStateResponse.device reports which was actually taken. */
    RADIO_DEVICE_AUTO = 2;
}

message DecodeRawRequest {
    string path = 1;
}

message DecodeRawResponse {
    string protocol = 1;
    string flipper_format = 2;
    uint32 percent = 3;
    uint32 hit_count = 4;
    /* Edges counted in this slice of the capture. The companion normalizes
     * against the loudest slice to draw the envelope as the decode walks it. */
    uint32 activity = 5;
}

/* The device's own Sub-GHz settings table, so a companion can offer exactly
 * the frequencies and presets this Flipper has - including whatever the user
 * added to setting_user - instead of carrying its own copy that can drift. */
message SettingsRequest {
}

message SettingsResponse {
    repeated uint32 frequencies = 1;
    repeated uint32 hopper_frequencies = 2;
    /* Preset names exactly as subghz_setting registers them. These are the
     * strings RxStartRequest.preset expects. */
    repeated string presets = 3;
    uint32 default_frequency = 4;
}

/* Stops a running DecodeRaw without closing the RPC session. */
message DecodeRawStopRequest {
}

/* Starts a live receive session. The radio stays owned by RPC until
 * RxStopRequest, the session closes, or the SubGhz app takes the radio.
 * Answers immediately; RxEvent frames then arrive unsolicited. */
/* Bits of SubGhzProtocolFlag a hit may not carry, matching the Sub-GHz app's
 * "Ignore ..." switches. A hit whose protocol matches any of these is dropped
 * after decoding, as the on-device receiver scene does it. */
enum ProtocolFilter {
    PROTOCOL_FILTER_NONE = 0;
    PROTOCOL_FILTER_REVERS_RB2 = 2048;
    PROTOCOL_FILTER_ALARMS = 4096;
    PROTOCOL_FILTER_SENSORS = 8192;
    PROTOCOL_FILTER_PRINCETON = 16384;
    PROTOCOL_FILTER_NICE_FLOR_S = 32768;
}

message RxStartRequest {
    uint32 frequency = 1;
    string preset = 2;
    uint32 rssi_interval_ms = 3;
    bool hopping = 4;
    repeated uint32 hop_frequencies = 5;
    RadioDevice device = 6;
    /* Include the pulse train of each hit. Off by default: it costs about a
     * kilobyte per hit, which is a lot of airtime on BLE. */
    bool capture_pulses = 7;
    /* OR of ProtocolFilter bits. */
    uint32 ignore_filter = 8;
    /* Alternate between preset and preset_b while hopping. */
    bool modulation_hopping = 9;
    string preset_b = 10;
    /* Chirp the Flipper speaker on each hit. */
    bool sound = 11;
}

message RxStopRequest {
}

/* Retunes a running session. Unset fields keep their current value. */
message RxConfigRequest {
    uint32 frequency = 1;
    string preset = 2;
    bool hopping = 3;
    repeated uint32 hop_frequencies = 4;
    bool capture_pulses = 5;
    uint32 ignore_filter = 6;
    bool modulation_hopping = 7;
    string preset_b = 8;
    bool sound = 9;
}

/* Answers RxStartRequest / RxConfigRequest with the settings actually applied,
 * which may differ from the request (frequency snapped by the radio, preset
 * rejected, external device missing). */
message RxStateResponse {
    bool running = 1;
    uint32 frequency = 2;
    string preset = 3;
    bool hopping = 4;
    RadioDevice device = 5;
    bool tx_allowed = 6;
    string device_name = 7;
    uint32 ignore_filter = 8;
    bool modulation_hopping = 9;
    string preset_b = 10;
    bool sound = 11;
}

enum RxEventType {
    RX_EVENT_RSSI = 0;
    RX_EVENT_HIT = 1;
    RX_EVENT_STOPPED = 2;
}

/* Unsolicited (command_id 0) while a receive session runs. */
message RxEvent {
    RxEventType type = 1;
    /* RSSI: one signed dBm byte per sample, oldest first. */
    bytes rssi_samples = 2;
    uint32 frequency = 3;
    sint32 noise_floor = 4;
    /* HIT. */
    string protocol = 5;
    string flipper_format = 6;
    sint32 rssi = 7;
    uint32 timestamp_ms = 8;
    bool transmittable = 9;
    /* HIT, only with capture_pulses: duration in microseconds in bits 0..30,
     * level in bit 31, oldest first. */
    repeated uint32 pulses = 10;
}

/* Transmits a key file. Pauses a running receive session and resumes it after.
 * Either flipper_format (inline key file) or path (a .sub on the SD). */
message TxRequest {
    string flipper_format = 1;
    string path = 2;
    uint32 repeat = 3;
    RadioDevice device = 4;
}

message TxResponse {
    uint32 repeat = 1;
    uint32 frequency = 2;
}
